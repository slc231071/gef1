<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b4d">
  <title>登入 · 智学伴</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">智学伴</p>
    <h1>账户登入</h1>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="login-form" id="login-form">
      <label>用户名
        <input name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label>密码
        <span class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="password-toggle" aria-label="显示密码">显示</button>
        </span>
      </label>
      <button type="submit" class="primary-button">登入</button>
    </form>
    <p class="hint">示例账户：teacher / teacher123 · student / student123</p>
  </main>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var password = document.getElementById("password");
      var toggle = document.getElementById("password-toggle");
      toggle.addEventListener("click", function () {
        var show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.textContent = show ? "隐藏" : "显示";
        toggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
      });
      form.addEventListener("submit", function () {
        var button = form.querySelector("button[type=submit]");
        button.disabled = true;
        button.textContent = "登入中…";
      });
    })();
  </script>
</body>
</html>
